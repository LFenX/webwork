<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>my-space · 多用户空间 · 登录前落地页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="preview/tokens.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0d10; }
    body { font-family: "Inter", "PingFang SC", system-ui, sans-serif; color: #e6e1d6; }
    #root { min-height: 100%; }
    /* Force minimum desktop width — landing is desktop-first */
    .gh-page { min-width: 1280px; }
    /* Page is no longer wrapped in artboard — apply same base */
    .gh-page * { box-sizing: border-box; }
    .gh-page a { color: inherit; text-decoration: none; transition: color .15s; }
    .gh-page a:hover { color: var(--accent); }
    .gh-page h1, .gh-page h2, .gh-page h3, .gh-page h4 { margin: 0; }
    .gh-page p { margin: 0; }
    .gh-page button { font-family: inherit; }
    .gh-page hr { border: 0; height: 1px; background: var(--line); margin: 0; }
    .gh-page ::selection { background: var(--accent); color: var(--bg-deep); }

    /* Light mode mirrors the actual webappwork app's暖白 + 蓝品牌 + Claude 橙 token system */
    .is-light {
      --bg:           #F7F4EC;
      --bg-deep:      #FBFAF7;
      --surface:      #FFFFFF;
      --surface-2:    #F3F1EA;
      --surface-3:    #ECE9DD;
      --line:         rgba(15,23,42,0.06);
      --line-2:       rgba(15,23,42,0.10);
      --line-strong:  rgba(15,23,42,0.18);
      --text:         #1A1A1A;
      --text-2:       #5B5B5B;
      --text-3:       #8B8B8B;
      --text-4:       #B5B5B5;
      --accent:       #2563EB;
      --accent-soft:  rgba(37,99,235,0.10);
      --blue:         #2563EB;
      --blue-2:       #1D4ED8;
      --green:        #3A7D5C;
      --green-2:      #3A7D5C;
      --red:          #A8463A;
      --warm:         #C96442;
    }
    .is-light.accent-warm  { --accent: #C96442; --accent-soft: rgba(201,100,66,0.10); }
    .is-light.accent-red   { --accent: #A8463A; --accent-soft: rgba(168,70,58,0.10); }
    .is-light.accent-green { --accent: #3A7D5C; --accent-soft: rgba(58,125,92,0.10); }
    .no-italic .serif { font-style: normal !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="preview/tweaks-panel.jsx"></script>
  <script type="text/babel" src="preview/shared.jsx"></script>
  <script type="text/babel" src="preview/landing-header.jsx"></script>
  <script type="text/babel" src="preview/landing-sidebar.jsx"></script>
  <script type="text/babel" src="preview/landing-main.jsx"></script>
  <script type="text/babel" src="preview/landing.jsx"></script>
  <script type="text/babel" src="preview/app.jsx"></script>
</body>
</html>
